<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Husnain Tayab</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --bg: #020617; --panel: rgba(255,255,255,.05); --border: rgba(148,163,184,.18); --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, rgba(56,189,248,.12), transparent 30%), var(--bg); color: var(--text); font-family: Inter, sans-serif; }
    main { width: min(92vw, 720px); padding: 2rem; border: 1px solid var(--border); border-radius: 28px; background: var(--panel); backdrop-filter: blur(16px); box-shadow: 0 24px 70px rgba(2,6,23,.6); text-align: center; }
    h1 { margin: 0 0 .75rem; font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 6vw, 4rem); }
    p { margin: 0 auto 1.5rem; max-width: 56ch; color: var(--muted); line-height: 1.7; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 1.2rem; border-radius: 999px; text-decoration: none; color: #fff; background: linear-gradient(135deg, #2563eb, #38bdf8); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>The page you were looking for does not exist. Return to the portfolio homepage to continue exploring projects and experience.</p>
    <a href="/">Back to Home</a>
  </main>
</body>
